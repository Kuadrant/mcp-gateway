name: Helm Install Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - 'config/crd/**'
      - 'api/**'
      - 'Dockerfile*'
      - 'tests/helm/**'
      - 'build/helm-test.mk'
      - '.github/workflows/helm-install-test.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helm-install-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install tools
        run: make tools

      - name: Run Helm image rendering test
        run: make test-helm-render
      - name: Run helm install test
        run: make test-helm-install
