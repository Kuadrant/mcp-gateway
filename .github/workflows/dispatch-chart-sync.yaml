# Notifies the kuadrant-operator repo when this component's Helm chart changes.
# Uses the reusable workflow from kuadrant-operator.

name: Dispatch chart sync

on:
  push:
    branches:
      - main
      - 'release-*'
    paths:
      - 'charts/**'

jobs:
  dispatch:
    uses: Kuadrant/kuadrant-operator/.github/workflows/reusable-dispatch-chart-sync.yml@main
    with:
      component: mcp-gateway
    secrets: inherit
