# Standalone NeMo Guardrails server (config_id "phi3-judge") for e2e tests.
# Judge model is llm-d-inference-sim (llm-inference-sim-deployment.yaml)
# instead of a real LLM - no KServe, no TLS, no auth needed to run it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-guardrails-custom
  labels:
    app: nemo-guardrails-custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nemo-guardrails-custom
  template:
    metadata:
      labels:
        app: nemo-guardrails-custom
    spec:
      containers:
        - name: nemo-guardrails
          image: quay.io/trustyai/nemo-guardrails-server:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: CONFIG_ID
              value: phi3-judge
            - name: SIM_API_KEY
              value: "not-required"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: phi3-judge-config-volume
              mountPath: /app/config/phi3-judge
      volumes:
        - name: phi3-judge-config-volume
          configMap:
            name: nemo-phi3-as-judge-model-config
